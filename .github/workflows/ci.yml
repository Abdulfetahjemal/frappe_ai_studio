name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff (lint)
        run: ruff check frappe_ai_studio

      - name: Ruff (format check)
        run: ruff format --check frappe_ai_studio

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes libcst requests

      - name: Run unit tests
        # Frappe-dependent tests self-skip when Frappe isn't installed; the
        # pure-logic tests (security, writer, sanitizer, context, extraction)
        # run everywhere. Run from the repo root so the nested package resolves.
        run: |
          python -m unittest discover -s frappe_ai_studio/frappe_ai_studio/tests -t . -p "test_*.py" -v

      - name: Check Python syntax
        run: |
          python -m py_compile frappe_ai_studio/frappe_ai_studio/*.py
          python -m py_compile frappe_ai_studio/hooks.py
          python -m py_compile frappe_ai_studio/config/*.py

      - name: Check JS syntax
        run: |
          if command -v node &> /dev/null; then
            node --check frappe_ai_studio/public/js/ai_studio_page.js
            node --check frappe_ai_studio/public/js/ai_studio_global.js
          fi
